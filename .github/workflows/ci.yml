name: "Automated End-to-End Test Suite (300)"

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-and-build:
    name: "Automated End-to-End Test Suite (300)"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: npm ci

      - name: Install Python report dependencies
        run: python -m pip install openpyxl

      - name: Run All Automated Test Cases (326 tests)
        run: npm test

      - name: Build Production Application
        run: npm run build

      - name: Generate Master Test Reports (Excel)
        run: python scripts/generate-test-reports.py

      - name: Upload Test Report Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: securechat-test-reports
          path: |
            Test Cases/Selenium_Test_Report_*.xlsx
            Test Cases/Appium_Test_Report_*.xlsx
            Test Cases/Unit_Test_Report_*.xlsx
            Test Cases/Validation_Test_Report_*.xlsx
            Test Cases/Deployment_Status_Report_*.xlsx
            Test Cases/Load_Test_Report_*.xlsx
          if-no-files-found: ignore
          retention-days: 7
